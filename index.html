<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>埼玉大学 物理学PG 口述試験 問題集</title>
<script>
MathJax = { tex: { inlineMath: [['$','$'],['\\(','\\)']], displayMath: [['$$','$$'],['\\[','\\]']] }, startup: { typeset: false } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  :root {
    --primary: #1a237e;
    --primary-light: #3949ab;
    --secondary: #00695c;
    --secondary-light: #00897b;
    --bg: #f5f6fa;
    --card-bg: #ffffff;
    --text: #212121;
    --text-light: #757575;
    --border: #e0e0e0;
    --easy: #2e7d32;
    --easy-bg: #e8f5e9;
    --normal: #e65100;
    --normal-bg: #fff3e0;
    --hard: #b71c1c;
    --hard-bg: #ffebee;
    --checked-bg: #e8eaf6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: var(--primary);
    color: white;
    padding: 16px 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  header h1 { font-size: 1.25rem; font-weight: 700; }
  header p { font-size: 0.8rem; opacity: 0.8; margin-top: 2px; }
  .container { max-width: 900px; margin: 0 auto; padding: 16px; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; }
  .tab-btn {
    flex: 1; padding: 10px 16px; border: none; border-radius: 8px 8px 0 0;
    cursor: pointer; font-size: 0.95rem; font-weight: 600;
    background: #c5cae9; color: #3949ab; transition: all 0.2s;
  }
  .tab-btn.active { background: var(--primary); color: white; }
  .tab-btn:hover:not(.active) { background: #9fa8da; }

  /* Controls */
  .controls {
    background: var(--card-bg); border-radius: 8px; padding: 12px 16px;
    margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .controls label { font-size: 0.85rem; color: var(--text-light); }
  .controls select, .controls input[type=text] {
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 0.85rem; background: var(--bg); color: var(--text);
  }
  .progress-bar-wrap { flex: 1; min-width: 160px; }
  .progress-label { font-size: 0.8rem; color: var(--text-light); margin-bottom: 4px; }
  .progress-bar {
    height: 8px; background: var(--border); border-radius: 4px; overflow: hidden;
  }
  .progress-fill { height: 100%; background: var(--primary-light); transition: width 0.3s; }
  .btn-reset {
    padding: 6px 14px; background: #ef9a9a; border: none; border-radius: 6px;
    cursor: pointer; font-size: 0.82rem; color: #b71c1c; font-weight: 600;
  }
  .btn-reset:hover { background: #e57373; }

  /* Stats */
  .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .stat-chip {
    padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600;
    background: var(--card-bg); border: 1px solid var(--border);
  }

  /* Problem list */
  .problem-list { display: flex; flex-direction: column; gap: 10px; }

  .problem-card {
    background: var(--card-bg); border-radius: 10px; overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08); transition: box-shadow 0.2s;
    border-left: 4px solid transparent;
  }
  .problem-card:hover { box-shadow: 0 3px 10px rgba(0,0,0,0.12); }
  .problem-card.checked { background: var(--checked-bg); border-left-color: var(--primary-light); }

  .problem-header {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    cursor: pointer; user-select: none;
  }
  .problem-num {
    font-size: 0.75rem; font-weight: 700; color: white; background: var(--primary-light);
    border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0;
  }
  .problem-card.checked .problem-num { background: var(--secondary-light); }
  .problem-meta { display: flex; gap: 6px; flex-wrap: wrap; flex-shrink: 0; }
  .badge {
    padding: 2px 8px; border-radius: 12px; font-size: 0.72rem; font-weight: 600;
  }
  .badge-cat { background: #e8eaf6; color: #3949ab; }
  .badge-easy { background: var(--easy-bg); color: var(--easy); }
  .badge-normal { background: var(--normal-bg); color: var(--normal); }
  .badge-hard { background: var(--hard-bg); color: var(--hard); }

  .problem-title { flex: 1; font-size: 0.92rem; font-weight: 600; line-height: 1.4; }
  .expand-icon { font-size: 0.8rem; color: var(--text-light); flex-shrink: 0; }
  .check-btn {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border);
    background: white; cursor: pointer; flex-shrink: 0; display: flex;
    align-items: center; justify-content: center; font-size: 0.8rem;
    transition: all 0.15s;
  }
  .check-btn:hover { border-color: var(--secondary-light); }
  .problem-card.checked .check-btn {
    background: var(--secondary-light); border-color: var(--secondary-light); color: white;
  }

  .problem-body {
    display: none; padding: 0 16px 14px 16px; border-top: 1px solid var(--border);
  }
  .problem-body.open { display: block; }
  .problem-text { font-size: 0.9rem; line-height: 1.9; margin-top: 10px; }
  .hint-section { margin-top: 12px; }
  .hint-toggle {
    background: none; border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 12px; cursor: pointer; font-size: 0.8rem; color: var(--text-light);
  }
  .hint-toggle:hover { background: var(--bg); }
  .hint-body { display: none; margin-top: 8px; padding: 10px 12px; background: #fffde7;
    border-left: 3px solid #f9a825; border-radius: 0 6px 6px 0; font-size: 0.85rem; line-height: 1.8; }
  .hint-body.open { display: block; }

  .no-results { text-align: center; padding: 40px; color: var(--text-light); }

  /* Sync bar */
  .sync-bar {
    background: var(--card-bg); border-radius: 8px; padding: 10px 16px;
    margin-bottom: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08); font-size: 0.85rem;
  }
  .sync-bar-label { color: var(--text-light); font-weight: 600; margin-right: 2px; }
  .sync-btn {
    padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer;
    font-size: 0.83rem; font-weight: 600; transition: opacity 0.15s;
  }
  .sync-btn:disabled { opacity: 0.5; cursor: default; }
  .btn-export { background: #1a237e; color: white; }
  .btn-export:hover:not(:disabled) { background: #283593; }
  .btn-import { background: #e8eaf6; color: #1a237e; }
  .btn-import:hover:not(:disabled) { background: #c5cae9; }
  .sync-status {
    font-size: 0.82rem; padding: 4px 10px; border-radius: 12px; display: none;
  }
  .sync-status.ok  { display: inline-block; background: #e8f5e9; color: #2e7d32; }
  .sync-status.err { display: inline-block; background: #ffebee; color: #b71c1c; }
  .sync-status.loading { display: inline-block; background: #fff3e0; color: #e65100; }

  /* Answer upload section */
  .answer-section-outer {
    margin-top: 14px; border-top: 1px dashed var(--border); padding-top: 12px;
  }
  .answer-section-label {
    font-size: 0.78rem; font-weight: 700; color: var(--text-light);
    text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px;
  }
  .upload-area {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px; border: 2px dashed var(--border); border-radius: 8px;
    cursor: pointer; font-size: 0.85rem; color: var(--text-light);
    background: var(--bg); transition: all 0.2s;
  }
  .upload-area:hover { border-color: var(--primary-light); color: var(--primary-light); background: #eef0fb; }
  .answer-file-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 12px; background: var(--bg); border-radius: 8px;
    border: 1px solid var(--border);
  }
  .answer-file-icon { font-size: 1.4rem; flex-shrink: 0; }
  .answer-filename {
    flex: 1; font-size: 0.85rem; font-weight: 600; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px;
  }
  .answer-thumb {
    width: 60px; height: 60px; object-fit: cover; border-radius: 6px;
    border: 1px solid var(--border); cursor: pointer; flex-shrink: 0;
  }
  .answer-btn {
    padding: 5px 12px; border-radius: 6px; border: none;
    cursor: pointer; font-size: 0.8rem; font-weight: 600;
  }
  .answer-view-btn { background: var(--primary-light); color: white; }
  .answer-view-btn:hover { background: var(--primary); }
  .answer-del-btn { background: #ffcdd2; color: #c62828; }
  .answer-del-btn:hover { background: #ef9a9a; }
  .answer-badge {
    font-size: 0.7rem; padding: 1px 6px; border-radius: 10px;
    background: #e8f5e9; color: #2e7d32; font-weight: 700; flex-shrink: 0;
  }

  /* Image lightbox */
  .lightbox-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    z-index: 9999; align-items: center; justify-content: center;
  }
  .lightbox-overlay.open { display: flex; }
  .lightbox-img { max-width: 92vw; max-height: 92vh; border-radius: 4px; }
  .lightbox-close {
    position: absolute; top: 16px; right: 20px; color: white; font-size: 2rem;
    cursor: pointer; background: none; border: none; line-height: 1;
  }

  /* PDF modal */
  .pdf-modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    z-index: 9999; flex-direction: column;
  }
  .pdf-modal-overlay.open { display: flex; }
  .pdf-modal-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px; background: #263238; color: white; flex-shrink: 0;
    gap: 12px;
  }
  .pdf-modal-title { font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pdf-modal-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .pdf-modal-btn {
    padding: 5px 14px; border-radius: 6px; border: none; cursor: pointer;
    font-size: 0.82rem; font-weight: 600;
  }
  .pdf-dl-btn { background: #80cbc4; color: #004d40; }
  .pdf-close-btn { background: #ef9a9a; color: #b71c1c; }
  .pdf-modal-frame { flex: 1; width: 100%; border: none; background: #525659; }

  @media (max-width: 600px) {
    .problem-header { flex-wrap: wrap; }
    .problem-title { width: 100%; order: 3; }
  }
</style>
</head>
<body>

<header>
  <h1>埼玉大学 物理学PG 口述試験 問題集</h1>
  <p>博士前期課程 ｜ 熱・統計力学 / 量子力学 ｜ 各50問</p>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('thermo')">🌡 熱・統計力学（50問）</button>
    <button class="tab-btn" onclick="switchTab('quantum')">⚛ 量子力学（50問）</button>
  </div>

  <div class="controls">
    <label>難易度:
      <select id="filter-level" onchange="applyFilters()">
        <option value="">すべて</option>
        <option value="基礎">基礎</option>
        <option value="標準">標準</option>
        <option value="応用">応用</option>
      </select>
    </label>
    <label>カテゴリ:
      <select id="filter-cat" onchange="applyFilters()">
        <option value="">すべて</option>
      </select>
    </label>
    <label>🔍
      <input type="text" id="search-input" placeholder="キーワード検索" oninput="applyFilters()" style="width:160px">
    </label>
    <div class="progress-bar-wrap">
      <div class="progress-label" id="progress-label">進捗: 0 / 50</div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
    <button class="btn-reset" onclick="resetProgress()">リセット</button>
  </div>

  <div class="sync-bar">
    <span class="sync-bar-label">バックアップ：</span>
    <button class="sync-btn btn-export" id="btn-export" onclick="exportData()">エクスポート（保存）</button>
    <label class="sync-btn btn-import" style="cursor:pointer">
      インポート（復元）
      <input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(this)">
    </label>
    <span class="sync-status" id="sync-status"></span>
  </div>

  <div class="stats" id="stats"></div>
  <div class="problem-list" id="problem-list"></div>
</div>

<!-- Image lightbox -->
<div class="lightbox-overlay" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">&#x2715;</button>
  <img class="lightbox-img" id="lightbox-img" src="" alt="">
</div>

<!-- PDF modal -->
<div class="pdf-modal-overlay" id="pdf-modal">
  <div class="pdf-modal-bar">
    <span class="pdf-modal-title" id="pdf-modal-title"></span>
    <div class="pdf-modal-actions">
      <a class="pdf-modal-btn pdf-dl-btn" id="pdf-dl-link" download="">ダウンロード</a>
      <button class="pdf-modal-btn pdf-close-btn" onclick="closePdfModal()">閉じる</button>
    </div>
  </div>
  <iframe class="pdf-modal-frame" id="pdf-modal-frame" src=""></iframe>
</div>


<script>
const THERMO = [
  // ── 熱力学基礎 ──
  {
    id:'T1', num:1, cat:'熱力学基礎', level:'基礎',
    title:'熱力学の第0法則と温度の定義',
    text:'熱力学の第0法則を述べ、それが「温度」という概念をどのように正当化するかを説明せよ。',
    hint:'熱平衡の推移律に着目する。もし $A$ と $B$ が熱平衡にあり、$B$ と $C$ が熱平衡にあれば…'
  },
  {
    id:'T2', num:2, cat:'熱力学基礎', level:'基礎',
    title:'熱力学第1法則とその意味',
    text:'熱力学第1法則 $dU = \\delta Q - \\delta W$ を述べ、内部エネルギー $U$ が状態量である理由を説明せよ。また、$\\delta Q$ と $\\delta W$ が完全微分でない理由も述べよ。',
    hint:'経路に依存する量と状態に依存する量の違いを考える。サイクルを回して $\\oint \\delta Q \\neq 0$ となる例を示すと良い。'
  },
  {
    id:'T3', num:3, cat:'熱力学基礎', level:'基礎',
    title:'熱力学第2法則とエントロピーの増大則',
    text:'クラウジウスの原理またはトムソンの原理を述べ、そこからエントロピー $S$ の概念を導入せよ。孤立系のエントロピーが増大する理由を述べよ。',
    hint:'可逆過程では $\\oint \\frac{\\delta Q}{T} = 0$、不可逆過程では $< 0$（クラウジウスの不等式）。'
  },
  {
    id:'T4', num:4, cat:'熱力学基礎', level:'基礎',
    title:'カルノーサイクルと効率',
    text:'カルノーサイクルの4つのステップを説明し、熱効率 $\\eta = 1 - T_2/T_1$ を導け。この効率がすべての可逆サイクルで同じになることを述べよ。',
    hint:'等温膨張・断熱膨張・等温圧縮・断熱圧縮の4過程。$W = Q_1 - Q_2$ から出発する。'
  },
  {
    id:'T5', num:5, cat:'熱力学基礎', level:'基礎',
    title:'熱力学ポテンシャルと自然な変数',
    text:'内部エネルギー $U(S,V)$、ヘルムホルツ自由エネルギー $F(T,V)$、エンタルピー $H(S,P)$、ギブス自由エネルギー $G(T,P)$ の定義と自然な変数を示し、各々が最小になる条件（平衡条件）を述べよ。',
    hint:'ルジャンドル変換で互いに移り変わる。各ポテンシャルの全微分を書き、係数を読み取る。'
  },
  {
    id:'T6', num:6, cat:'熱力学基礎', level:'標準',
    title:'マクスウェルの関係式',
    text:'ヘルムホルツ自由エネルギーから出発して、マクスウェルの関係式 $\\left(\\frac{\\partial S}{\\partial V}\\right)_T = \\left(\\frac{\\partial P}{\\partial T}\\right)_V$ を導け。他の3つのマクスウェル関係式も列挙せよ。',
    hint:'$dF = -SdT - PdV$ で、混合偏微分が交換可能なことを使う。'
  },
  {
    id:'T7', num:7, cat:'熱力学基礎', level:'標準',
    title:'比熱の定義と関係式',
    text:'定積比熱 $C_V$ と定圧比熱 $C_P$ を定義し、$C_P - C_V = \\frac{TV\\alpha^2}{\\kappa_T}$（ここで $\\alpha$ は熱膨張率、$\\kappa_T$ は等温圧縮率）を示せ。理想気体での結果を確認せよ。',
    hint:'$C_P - C_V = \\left[P + \\left(\\frac{\\partial U}{\\partial V}\\right)_T\\right]\\left(\\frac{\\partial V}{\\partial T}\\right)_P$ から出発。'
  },
  {
    id:'T8', num:8, cat:'熱力学基礎', level:'標準',
    title:'ジュール・トムソン効果',
    text:'ジュール・トムソン効果（絞り過程）を説明し、エンタルピーが保存されることを示せ。ジュール・トムソン係数 $\\mu_{JT} = \\left(\\frac{\\partial T}{\\partial P}\\right)_H$ を求め、理想気体で $\\mu_{JT} = 0$ となることを確認せよ。',
    hint:'定常流過程でのエンタルピー保存 $H_1 = H_2$ の導出から始める。'
  },
  // ── 気体理論 ──
  {
    id:'T9', num:9, cat:'気体理論', level:'基礎',
    title:'理想気体の状態方程式と気体分子運動論',
    text:'気体分子運動論から出発して、理想気体の状態方程式 $PV = nRT$ を導け。分子の平均運動エネルギーと温度の関係を示せ。',
    hint:'$P = \\frac{Nm\\langle v^2 \\rangle}{3V}$ の導出がカギ。$\\langle v^2 \\rangle$ と $T$ の関係からへと繋げる。'
  },
  {
    id:'T10', num:10, cat:'気体理論', level:'基礎',
    title:'マクスウェル-ボルツマン速度分布',
    text:'マクスウェル-ボルツマン速度分布関数 $f(v)$ を書き、最確速度・平均速度・二乗平均速度を求めよ。これらの大小関係を示せ。',
    hint:'$f(v) = 4\\pi n\\left(\\frac{m}{2\\pi k_B T}\\right)^{3/2} v^2 e^{-mv^2/2k_BT}$ から積分。大小関係は $v_p < \\bar{v} < v_{rms}$。'
  },
  {
    id:'T11', num:11, cat:'気体理論', level:'標準',
    title:'エネルギー等分配の定理',
    text:'エネルギー等分配の定理を述べ、1原子理想気体・2原子理想気体のモル比熱 $C_V$ をこの定理から求めよ。低温での量子効果（比熱の「凍結」）についても言及せよ。',
    hint:'各自由度に $\\frac{1}{2}k_BT$ の熱エネルギーが配分される。2原子気体は並進3＋回転2＝5自由度。'
  },
  {
    id:'T12', num:12, cat:'気体理論', level:'標準',
    title:'ファン・デル・ワールス方程式',
    text:'ファン・デル・ワールス方程式 $\\left(P + \\frac{a}{V^2}\\right)(V - b) = RT$ を説明し、理想気体からの補正項 $a, b$ の物理的意味を述べよ。また、臨界点の条件を求めよ。',
    hint:'$a$ は分子間引力、$b$ は分子の有限体積。臨界点では $\\frac{\\partial P}{\\partial V} = \\frac{\\partial^2 P}{\\partial V^2} = 0$。'
  },
  // ── 統計力学基礎 ──
  {
    id:'T13', num:13, cat:'統計力学基礎', level:'基礎',
    title:'ボルツマンのエントロピーと統計的解釈',
    text:'ボルツマンのエントロピー公式 $S = k_B \\ln W$ を述べ、$W$ の意味を説明せよ。理想気体に適用し、熱力学的エントロピーと一致することを示せ。',
    hint:'$W$ は等エネルギーの微視的状態数（統計的重率）。理想気体の $W$ の計算にはスターリング近似 $\\ln N! \\approx N\\ln N - N$ を用いる。'
  },
  {
    id:'T14', num:14, cat:'統計力学基礎', level:'基礎',

// ── IndexedDB: Answer storage ──
let db = null;
const answerCache = {}; // {problemId: {fileName, fileType}}

function initDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('physicsExamAnswers', 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore('answers', {keyPath: 'id'});
    req.onsuccess = e => { db = e.target.result; resolve(); };
    req.onerror = e => reject(e);
  });
}

function loadAllAnswerMeta() {
  return new Promise(resolve => {
    const req = db.transaction('answers', 'readonly').objectStore('answers').getAll();
    req.onsuccess = e => {
      e.target.result.forEach(item => { answerCache[item.id] = {fileName: item.fileName, fileType: item.fileType}; });
      resolve();
    };
    req.onerror = () => resolve();
  });
}

function saveAnswer(id, file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const tx = db.transaction('answers', 'readwrite');
      tx.objectStore('answers').put({id, fileName: file.name, fileType: file.type, data: e.target.result});
      tx.oncomplete = () => { answerCache[id] = {fileName: file.name, fileType: file.type}; resolve(); };
      tx.onerror = reject;
    };
    reader.readAsDataURL(file);
  });
}

function loadAnswerData(id) {
  return new Promise(resolve => {
    const req = db.transaction('answers', 'readonly').objectStore('answers').get(id);
    req.onsuccess = e => resolve(e.target.result || null);
    req.onerror = () => resolve(null);
  });
}

function removeAnswer(id) {
  return new Promise(resolve => {
    const tx = db.transaction('answers', 'readwrite');
    tx.objectStore('answers').delete(id);
    tx.oncomplete = () => { delete answerCache[id]; resolve(); };
    tx.onerror = () => resolve();
  });
}

function renderAnswerSection(id) {
  const el = document.getElementById('answer-' + id);
  if (!el) return;
  const meta = answerCache[id];
  if (!meta) {
    el.innerHTML = `
      <div class="answer-section-outer">
        <div class="answer-section-label">回答</div>
        <label class="upload-area" for="upload-${id}">
          <span>📎</span> アップロード（PDF / 画像）
          <input type="file" id="upload-${id}" accept=".pdf,image/*" style="display:none" onchange="handleUpload('${id}', this)">
        </label>
      </div>`;
  } else {
    const isImg = meta.fileType.startsWith('image/');
    el.innerHTML = `
      <div class="answer-section-outer">
        <div class="answer-section-label">回答</div>
        <div class="answer-file-row" id="answer-file-row-${id}">
          <span class="answer-file-icon">${isImg ? '🖼' : '📄'}</span>
          <span class="answer-filename" title="${meta.fileName}">${meta.fileName}</span>
          <button class="answer-btn answer-view-btn" onclick="viewAnswer('${id}')">表示</button>
          <button class="answer-btn answer-del-btn" onclick="deleteAnswerUI('${id}')">削除</button>
        </div>
        ${isImg ? `<img class="answer-thumb" id="thumb-${id}" src="" alt="プレビュー" onclick="viewAnswer('${id}')">` : ''}
      </div>`;
    if (isImg) {
      loadAnswerData(id).then(item => {
        const thumb = document.getElementById('thumb-' + id);
        if (thumb && item) thumb.src = item.data;
      });
    }
  }
  // Update header badge
  const badge = document.getElementById('answer-badge-' + id);
  if (badge) { badge.style.display = meta ? '' : 'none'; }
}

async function handleUpload(id, input) {
  const file = input.files[0];
  if (!file) return;
  await saveAnswer(id, file);
  renderAnswerSection(id);
  const badge = document.getElementById('answer-badge-' + id);
  if (badge) badge.style.display = '';
}

let _pdfBlobUrl = null;

async function viewAnswer(id) {
  const item = await loadAnswerData(id);
  if (!item) return;
  if (item.fileType.startsWith('image/')) {
    document.getElementById('lightbox-img').src = item.data;
    document.getElementById('lightbox').classList.add('open');
  } else {
    // PDFはページ内モーダルで表示（window.open不要）
    if (_pdfBlobUrl) URL.revokeObjectURL(_pdfBlobUrl);
    const res = await fetch(item.data);
    const blob = await res.blob();
    _pdfBlobUrl = URL.createObjectURL(blob);
    document.getElementById('pdf-modal-frame').src = _pdfBlobUrl;
    document.getElementById('pdf-modal-title').textContent = item.fileName;
    const dlLink = document.getElementById('pdf-dl-link');
    dlLink.href = _pdfBlobUrl;
    dlLink.download = item.fileName;
    document.getElementById('pdf-modal').classList.add('open');
  }
}

async function deleteAnswerUI(id) {
  if (!confirm('回答ファイルを削除しますか？')) return;
  await removeAnswer(id);
  renderAnswerSection(id);
  const badge = document.getElementById('answer-badge-' + id);
  if (badge) badge.style.display = 'none';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

function closePdfModal() {
  document.getElementById('pdf-modal').classList.remove('open');
  document.getElementById('pdf-modal-frame').src = '';
  if (_pdfBlobUrl) { URL.revokeObjectURL(_pdfBlobUrl); _pdfBlobUrl = null; }
}

// ── Export / Import ──
function showSyncStatus(msg, type, durationMs = 4000) {
  const el = document.getElementById('sync-status');
  el.textContent = msg;
  el.className = 'sync-status ' + type;
  if (durationMs > 0) setTimeout(() => { el.className = 'sync-status'; }, durationMs);
}

async function exportData() {
  const btn = document.getElementById('btn-export');
  btn.disabled = true;
  showSyncStatus('エクスポート中…', 'loading', 0);
  try {
    // IndexedDB から全回答を取得
    const answers = await new Promise((resolve, reject) => {
      const req = db.transaction('answers', 'readonly').objectStore('answers').getAll();
      req.onsuccess = e => resolve(e.target.result);
      req.onerror = reject;
    });

    const payload = {
      version: 1,
      exportedAt: new Date().toISOString(),
      checkedIDs: JSON.parse(localStorage.getItem('checkedIDs') || '{}'),
      answers: answers  // [{id, fileName, fileType, data(base64)}]
    };

    const json = JSON.stringify(payload);
    const blob = new Blob([json], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const date = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `physics_exam_backup_${date}.json`;
    a.click();
    URL.revokeObjectURL(url);

    const sizeMB = (blob.size / 1024 / 1024).toFixed(1);
    showSyncStatus(`✓ 保存完了（${answers.length}件の回答, ${sizeMB} MB）`, 'ok');
  } catch (e) {
    showSyncStatus('エクスポートに失敗しました', 'err');
    console.error(e);
  } finally {
    btn.disabled = false;
  }
}

async function importData(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = ''; // 同じファイルを再度選べるようリセット

  if (!confirm('インポートすると現在の進捗と回答ファイルが上書きされます。続けますか？')) return;

  showSyncStatus('インポート中…', 'loading', 0);
  try {
    const text = await file.text();
    const payload = JSON.parse(text);

    if (!payload.version || !payload.checkedIDs) {
      throw new Error('ファイル形式が正しくありません');
    }

    // チェック状態を復元
    localStorage.setItem('checkedIDs', JSON.stringify(payload.checkedIDs));
    checkedIDs = payload.checkedIDs;

    // 回答ファイルを IndexedDB に復元
    const answerList = payload.answers || [];
    if (answerList.length > 0) {
      await new Promise((resolve, reject) => {
        const tx = db.transaction('answers', 'readwrite');
        const store = tx.objectStore('answers');
        // 既存データをクリアしてから書き込む
        store.clear();
        answerList.forEach(item => store.put(item));
        tx.oncomplete = resolve;
        tx.onerror = reject;
      });
      // キャッシュを再構築
      Object.keys(answerCache).forEach(k => delete answerCache[k]);
      answerList.forEach(item => {
        answerCache[item.id] = {fileName: item.fileName, fileType: item.fileType};
      });
    }

    openCards = {};
    renderAll();
    const date = payload.exportedAt ? payload.exportedAt.slice(0, 10) : '不明';
    showSyncStatus(`✓ 復元完了（${date} 保存分, ${answerList.length}件の回答）`, 'ok');
  } catch (e) {
    showSyncStatus('インポートに失敗: ' + e.message, 'err');
    console.error(e);
  }
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', (i===0) === (tab==='thermo')));

  sel.innerHTML = '<option value="">すべて</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');
}

function getChecked() { return checkedIDs[currentTab] || {}; }
function setChecked(id, val) {
  if (!checkedIDs[currentTab]) checkedIDs[currentTab] = {};
  if (val) checkedIDs[currentTab][id] = true;
  else delete checkedIDs[currentTab][id];
  localStorage.setItem('checkedIDs', JSON.stringify(checkedIDs));
}

function applyFilters() { renderAll(); }

function renderAll() {
  const lv = document.getElementById('filter-level').value;
  const cat = document.getElementById('filter-cat').value;
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const checked = getChecked();

  let list = problems().filter(p => {
    if (lv && p.level !== lv) return false;
    if (cat && p.cat !== cat) return false;
    if (q && !(p.title.toLowerCase().includes(q) || p.text.toLowerCase().includes(q) || p.cat.toLowerCase().includes(q))) return false;
    return true;
  });

  const total = problems().length;
  const doneCount = Object.keys(getChecked()).length;
  const pct = Math.round(doneCount / total * 100);
  document.getElementById('progress-label').textContent = `進捗: ${doneCount} / ${total} (${pct}%)`;
  document.getElementById('progress-fill').style.width = pct + '%';

  // Stats
  const byLevel = {基礎:0, 標準:0, 応用:0};
  problems().forEach(p => { if (checked[p.id]) byLevel[p.level]++; });
  document.getElementById('stats').innerHTML =
    `<span class="stat-chip" style="background:var(--easy-bg);color:var(--easy)">基礎 ${byLevel['基礎']}/${problems().filter(p=>p.level==='基礎').length}</span>` +
    `<span class="stat-chip" style="background:var(--normal-bg);color:var(--normal)">標準 ${byLevel['標準']}/${problems().filter(p=>p.level==='標準').length}</span>` +
    `<span class="stat-chip" style="background:var(--hard-bg);color:var(--hard)">応用 ${byLevel['応用']}/${problems().filter(p=>p.level==='応用').length}</span>` +
    `<span class="stat-chip">表示中 ${list.length}問</span>`;

  const container = document.getElementById('problem-list');
  if (list.length === 0) {
    container.innerHTML = '<div class="no-results">条件に合う問題がありません</div>';
    return;
  }

  container.innerHTML = list.map(p => {
    const isChecked = !!checked[p.id];
    const isOpen = !!openCards[p.id];
    const badgeClass = p.level === '基礎' ? 'badge-easy' : p.level === '標準' ? 'badge-normal' : 'badge-hard';
    return `
    <div class="problem-card ${isChecked ? 'checked' : ''}" id="card-${p.id}">
      <div class="problem-header" onclick="toggleCard('${p.id}')">
        <div class="problem-num">${p.num}</div>
        <div class="problem-meta">
          <span class="badge badge-cat">${p.cat}</span>
          <span class="badge ${badgeClass}">${p.level}</span>
        </div>
        <div class="problem-title">${p.title}</div>
        <span class="answer-badge" id="answer-badge-${p.id}" style="display:${answerCache[p.id] ? '' : 'none'}">回答済</span>
        <button class="check-btn" onclick="event.stopPropagation(); toggleCheck('${p.id}')" title="完了マーク">${isChecked ? '✓' : ''}</button>
        <span class="expand-icon">${isOpen ? '▲' : '▼'}</span>
      </div>
      <div class="problem-body ${isOpen ? 'open' : ''}" id="body-${p.id}">
        <div class="problem-text">${p.text}</div>
        <div class="hint-section">
          <button class="hint-toggle" onclick="toggleHint('${p.id}')">ヒントを見る</button>
          <div class="hint-body" id="hint-${p.id}"><strong>ヒント：</strong>${p.hint}</div>
        </div>
        <div id="answer-${p.id}"></div>
      </div>
    </div>`;
  }).join('');

  if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
    MathJax.typesetPromise([container]).catch(e => console.warn(e));
  }
  // Populate answer sections for open cards
  list.forEach(p => { if (openCards[p.id]) renderAnswerSection(p.id); });
}

function toggleCard(id) {
  openCards[id] = !openCards[id];
  const body = document.getElementById('body-' + id);
  const card = document.getElementById('card-' + id);
  if (body) {
    body.classList.toggle('open', openCards[id]);
    const icon = card.querySelector('.expand-icon');
    if (icon) icon.textContent = openCards[id] ? '▲' : '▼';
    if (openCards[id]) {
      renderAnswerSection(id);
      if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
        MathJax.typesetPromise([body]).catch(e => console.warn(e));
      }
    }
  }
}

function toggleCheck(id) {
  const current = !!getChecked()[id];
  setChecked(id, !current);
  renderAll();
}

function toggleHint(id) {
  const hint = document.getElementById('hint-' + id);
  if (hint) {
    hint.classList.toggle('open');
    const btn = hint.previousElementSibling;
    if (btn) btn.textContent = hint.classList.contains('open') ? 'ヒントを隠す' : 'ヒントを見る';
    if (hint.classList.contains('open') && typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
      MathJax.typesetPromise([hint]).catch(e => console.warn(e));
    }
  }
}

function resetProgress() {
  if (confirm('このタブの進捗をリセットしますか？')) {
    if (checkedIDs[currentTab]) {
      delete checkedIDs[currentTab];
      localStorage.setItem('checkedIDs', JSON.stringify(checkedIDs));
    }
    renderAll();
  }
}

// init
buildCatFilter();
initDB()
  .then(() => loadAllAnswerMeta())
  .then(() => renderAll())
  .catch(() => renderAll()); // DB失敗時もUIは表示する
</script>
</body>
</html>
